<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Animated Data Flow Effect -->
    <linearGradient id="flowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    /* Dynamic Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-30px) rotate(180deg); opacity: 0.2; }
    }

    @keyframes dashMove {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes serverPulse {
      0%, 100% { fill: #38bdf8; filter: drop-shadow(0 0 2px #38bdf8); }
      50% { fill: #34d399; filter: drop-shadow(0 0 6px #34d399); }
    }

    .pulse-bg-1 { animation: pulseGlow 8s infinite ease-in-out; transform-origin: 200px 100px; }
    .pulse-bg-2 { animation: pulseGlow 10s infinite ease-in-out 2s; transform-origin: 1000px 280px; }
    .data-stream { stroke-dasharray: 20, 10; animation: dashMove 20s linear infinite; }
    .status-led { animation: serverPulse 3s infinite ease-in-out; }
    .p1 { animation: floatParticle 6s infinite ease-in-out; }
    .p2 { animation: floatParticle 9s infinite ease-in-out 1s; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/>

  <!-- Ambient Animated Glow Orbs in Background -->
  <circle class="pulse-bg-1" cx="200" cy="80" r="180" fill="#0284c7" opacity="0.2" filter="blur(60px)"/>
  <circle class="pulse-bg-2" cx="1000" cy="280" r="200" fill="#6366f1" opacity="0.25" filter="blur(60px)"/>

  <!-- Background Storage Grid & Connectivity Lines -->
  <g opacity="0.15">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#94a3b8" stroke-width="1"/>
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Dynamic Animated Data Stream Lines (Below Content) -->
  <path class="data-stream" d="M -50,280 C 300,280 400,320 700,300 C 950,280 1050,340 1250,310" stroke="url(#cyanGlow)" stroke-width="3" fill="none"/>
  <path class="data-stream" d="M -50,320 C 200,340 500,260 850,330 C 1000,360 1150,290 1250,300" stroke="#818cf8" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Visual Graphic Elements: Cold Archiving Server Stack (Right Aligned) -->
  <g transform="translate(880, 60)" opacity="0.85">
    <!-- Server Chassis 1 (Hot/Warm Tier) -->
    <rect x="0" y="0" width="240" height="52" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <circle class="status-led" cx="24" cy="26" r="4"/>
    <rect x="44" y="22" width="120" height="8" rx="4" fill="#334155"/>
    <rect x="180" y="20" width="36" height="12" rx="3" fill="#0284c7" opacity="0.6"/>

    <!-- Server Chassis 2 (Cold Tier - Glacier/Blob) -->
    <rect x="0" y="68" width="240" height="52" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,3"/>
    <circle class="status-led" cx="24" cy="94" r="4" style="animation-delay: 1s;"/>
    <rect x="44" y="90" width="140" height="8" rx="4" fill="#334155"/>
    <text x="195" y="98" font-family="sans-serif" font-size="10" fill="#38bdf8" font-weight="bold">COLD</text>

    <!-- Server Chassis 3 (Deep Archive / Immutable Tape) -->
    <rect x="0" y="136" width="240" height="52" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <circle class="status-led" cx="24" cy="162" r="4" style="animation-delay: 2s;"/>
    <rect x="44" y="158" width="100" height="8" rx="4" fill="#334155"/>
    <text x="160" y="166" font-family="sans-serif" font-size="10" fill="#a7f3d0" font-weight="bold">IMMUTABLE</text>

    <!-- Snowflake / Vault Icon Indicator -->
    <g transform="translate(185, 12)" fill="#38bdf8">
      <path d="M10 0 L10 20 M0 10 L20 10 M3 3 L17 17 M3 17 L17 3" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Foreground Content Container (Always Visible & Sharp) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 65)">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
      <circle cx="16" cy="16" r="5" fill="#38bdf8"/>
      <text x="32" y="21" class="badge-text">🧊 CLOUD &amp; ON-PREM ARCHIVING PLATFORMS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="155" class="title" filter="url(#glow)">Cloud Cold Storage &amp; Data Archiving 🗄️</text>
    <text x="0" y="155" class="title">Cloud Cold Storage &amp; Data Archiving 🗄️</text>

    <!-- Subtitle -->
    <text x="0" y="205" class="subtitle">Curated Directory of AWS Glacier, Azure Archive, GCP, Ceph, MinIO &amp; Tape Solutions</text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 245)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="160" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">🔒 Immutable Archives</text>

      <!-- Tag 2 -->
      <rect x="172" y="0" width="175" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="184" y="18" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">💰 Cost &amp; Egress Control</text>

      <!-- Tag 3 -->
      <rect x="359" y="0" width="160" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="371" y="18" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">⚡ Tape &amp; S3 Compatibility</text>
    </g>
  </g>
</svg>
